<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FoodWise — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green: #1a7a4a; --green-lt: #25a862;
    --cream: #f7f3ed; --dark: #0f1f15; --mid: #2c4a35;
    --warn: #e05c3a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--dark);
    min-height: 100vh;
    display: flex;
  }
  .left {
    flex: 1;
    background: linear-gradient(145deg, #0f2d1a 0%, #1a4a28 60%, #0d1f12 100%);
    display: flex; flex-direction: column;
    justify-content: center; padding: 60px;
    position: relative; overflow: hidden;
  }
  .left::before {
    content: ''; position: absolute;
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(37,168,98,0.15) 0%, transparent 70%);
    top: -100px; left: -100px;
  }
  .brand { position: relative; z-index: 1; }
  .brand-icon {
    width: 56px; height: 56px; background: var(--green-lt);
    border-radius: 16px; display: flex; align-items: center;
    justify-content: center; font-size: 26px; margin-bottom: 32px;
  }
  .brand h1 {
    font-family: 'Syne', sans-serif; font-size: 48px; font-weight: 800;
    color: var(--cream); line-height: 1.1; margin-bottom: 16px;
  }
  .brand h1 span { color: var(--green-lt); }
  .brand p { color: rgba(247,243,237,0.55); font-size: 16px; line-height: 1.7; max-width: 340px; }

  .right {
    width: 520px; background: var(--cream);
    display: flex; align-items: center;
    justify-content: center; padding: 50px;
  }
  .form-box { width: 100%; }
  .form-box h2 {
    font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 700;
    color: var(--dark); margin-bottom: 6px;
  }
  .form-box .sub { color: #7a8c82; font-size: 14px; margin-bottom: 28px; }

  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--mid); margin-bottom: 7px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .field input, .field select {
    width: 100%; padding: 13px 16px;
    border: 2px solid #d9e8de; border-radius: 12px;
    font-family: 'DM Sans', sans-serif; font-size: 15px;
    color: var(--dark); background: #fff;
    transition: border-color 0.2s; outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--green-lt); }

  .btn {
    width: 100%; padding: 14px;
    background: var(--green); color: #fff; border: none;
    border-radius: 12px; font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background 0.2s; margin-top: 6px;
  }
  .btn:hover { background: var(--green-lt); }

  .login-link { text-align: center; font-size: 14px; color: #7a8c82; margin-top: 18px; }
  .login-link a { color: var(--green); font-weight: 600; text-decoration: none; }

  .error-msg {
    background: #fdecea; color: var(--warn);
    border: 1px solid #f5c6c0; border-radius: 10px;
    padding: 12px 16px; font-size: 14px; margin-bottom: 18px; display: none;
  }
  .success-msg {
    background: #e8f5ee; color: var(--green);
    border: 1px solid #b8dfc8; border-radius: 10px;
    padding: 12px 16px; font-size: 14px; margin-bottom: 18px; display: none;
  }

  @media (max-width: 800px) { .left { display: none; } .right { width: 100%; } }
</style>
</head>
<body>
<div class="left">
  <div class="brand">
    <div class="brand-icon">🌿</div>
    <h1>Food<span>Wise</span></h1>
    <p>Join thousands of food service teams reducing waste with intelligent demand forecasting.</p>
  </div>
</div>

<div class="right">
  <div class="form-box">
    <h2>Create Account</h2>
    <p class="sub">Get started with FoodWise today</p>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <div class="field">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your full name"/>
    </div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min. 6 characters"/>
    </div>
    <div class="field">
      <label>Role</label>
      <select id="role">
        <option value="">Select role...</option>
        <option value="Admin">Admin</option>
        <option value="Manager">Manager</option>
        <option value="Staff">Staff</option>
        <option value="NGO">NGO</option>
      </select>
    </div>

    <button class="btn" onclick="handleRegister()">Create Account</button>
    <p class="login-link">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<script>
  const API = "http://localhost:5000/api";

  async function handleRegister() {
    const name     = document.getElementById("name").value.trim();
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const role     = document.getElementById("role").value;
    const errEl    = document.getElementById("errorMsg");
    const sucEl    = document.getElementById("successMsg");

    errEl.style.display = "none";
    sucEl.style.display = "none";

    if (!name || !email || !password || !role) {
      errEl.textContent = "All fields are required.";
      errEl.style.display = "block"; return;
    }

    try {
      const res  = await fetch(`${API}/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password, role })
      });
      const data = await res.json();

      if (res.ok) {
        sucEl.textContent = "Account created! Redirecting to login...";
        sucEl.style.display = "block";
        setTimeout(() => window.location.href = "login.html", 1500);
      } else {
        errEl.textContent = data.message || "Registration failed.";
        errEl.style.display = "block";
      }
    } catch (e) {
      errEl.textContent = "Cannot connect to server.";
      errEl.style.display = "block";
    }
  }
</script>
</body>
</html>
