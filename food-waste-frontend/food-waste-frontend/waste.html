<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FoodWise — Waste Entry</title>
<link rel="stylesheet" href="shared.css"/>
</head>
<body>
<div id="sidebar" class="sidebar"></div>

<div class="main">
  <div class="page-header">
    <h1>Waste Entry</h1>
    <p>Record daily food wastage with reasons</p>
  </div>

  <div style="display:grid;grid-template-columns:400px 1fr;gap:28px;align-items:start">

    <div class="card">
      <div class="section-head"><h2>Record Waste</h2></div>
      <div id="alertBox" class="alert" style="display:none"></div>

      <div class="form-field">
        <label>Date</label>
        <input type="date" id="date"/>
      </div>
      <div class="form-field">
        <label>Food Item</label>
        <input type="text" id="item" placeholder="e.g. Rice, Bread"/>
      </div>
      <div class="form-field">
        <label>Quantity Wasted (kg)</label>
        <input type="number" id="wasted" min="0" placeholder="0"/>
      </div>
      <div class="form-field">
        <label>Reason (optional)</label>
        <input type="text" id="reason" placeholder="e.g. Overcooked, Expired"/>
      </div>

      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="addWaste()">Save Waste Record</button>
    </div>

    <div class="card">
      <div class="section-head">
        <h2>Waste Records</h2>
        <button class="btn btn-outline" onclick="loadWaste()">Refresh</button>
      </div>
      <table>
        <thead>
          <tr><th>Date</th><th>Item</th><th>Wasted</th><th>Reason</th><th>Severity</th></tr>
        </thead>
        <tbody id="wasteTable">
          <tr><td colspan="5" style="text-align:center;color:#7a8c82;padding:20px">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<script src="shared.js"></script>
<script>
  renderSidebar("waste");
  document.getElementById("date").value = new Date().toISOString().split("T")[0];

  async function addWaste() {
    const date   = document.getElementById("date").value;
    const item   = document.getElementById("item").value.trim();
    const wasted = document.getElementById("wasted").value;
    const reason = document.getElementById("reason").value.trim();

    if (!date || !item || !wasted) return showAlert("alertBox", "Date, item and wasted quantity are required.", "error");

    try {
      const res  = await fetch(`${API}/waste/add`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ date, item, wasted: parseInt(wasted), reason })
      });
      const data = await res.json();
      if (res.ok) {
        showAlert("alertBox", "Waste record saved!", "success");
        document.getElementById("item").value   = "";
        document.getElementById("wasted").value = "";
        document.getElementById("reason").value = "";
        loadWaste();
      } else {
        showAlert("alertBox", data.message, "error");
      }
    } catch (e) { showAlert("alertBox", "Server error.", "error"); }
  }

  async function loadWaste() {
    try {
      const res  = await fetch(`${API}/waste/all`);
      const data = await res.json();
      if (data.length) {
        document.getElementById("wasteTable").innerHTML = data.map(r => `
          <tr>
            <td>${r.date}</td>
            <td><strong>${r.item}</strong></td>
            <td>${r.wasted} kg</td>
            <td>${r.reason || '—'}</td>
            <td><span class="badge ${r.wasted > 20 ? 'badge-red' : r.wasted > 10 ? 'badge-yellow' : 'badge-green'}">${r.wasted > 20 ? 'High' : r.wasted > 10 ? 'Medium' : 'Low'}</span></td>
          </tr>
        `).join("");
      } else {
        document.getElementById("wasteTable").innerHTML = '<tr><td colspan="5" style="text-align:center;color:#7a8c82;padding:20px">No waste records yet</td></tr>';
      }
    } catch (e) {}
  }

  loadWaste();
</script>
</body>
</html>
