<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FoodWise — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green:    #1a7a4a;
    --green-lt: #25a862;
    --cream:    #f7f3ed;
    --dark:     #0f1f15;
    --mid:      #2c4a35;
    --accent:   #e8f5ee;
    --warn:     #e05c3a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--dark);
    min-height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* Left panel */
  .left {
    flex: 1;
    background: linear-gradient(145deg, #0f2d1a 0%, #1a4a28 60%, #0d1f12 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px;
    position: relative;
    overflow: hidden;
  }
  .left::before {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(37,168,98,0.15) 0%, transparent 70%);
    top: -100px; left: -100px;
  }
  .left::after {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(37,168,98,0.1) 0%, transparent 70%);
    bottom: 50px; right: 50px;
  }
  .brand { position: relative; z-index: 1; }
  .brand-icon {
    width: 56px; height: 56px;
    background: var(--green-lt);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    margin-bottom: 32px;
  }
  .brand h1 {
    font-family: 'Syne', sans-serif;
    font-size: 48px;
    font-weight: 800;
    color: var(--cream);
    line-height: 1.1;
    margin-bottom: 16px;
  }
  .brand h1 span { color: var(--green-lt); }
  .brand p {
    color: rgba(247,243,237,0.55);
    font-size: 16px;
    line-height: 1.7;
    max-width: 340px;
    margin-bottom: 48px;
  }
  .stats {
    display: flex;
    gap: 32px;
  }
  .stat-item { }
  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--green-lt);
  }
  .stat-label {
    font-size: 12px;
    color: rgba(247,243,237,0.4);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* Right panel */
  .right {
    width: 480px;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 50px;
  }
  .form-box { width: 100%; }
  .form-box h2 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 6px;
  }
  .form-box .sub {
    color: #7a8c82;
    font-size: 14px;
    margin-bottom: 36px;
  }

  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--mid);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #d9e8de;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--dark);
    background: #fff;
    transition: border-color 0.2s;
    outline: none;
  }
  .field input:focus { border-color: var(--green-lt); }

  .btn {
    width: 100%;
    padding: 15px;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 8px;
  }
  .btn:hover { background: var(--green-lt); }
  .btn:active { transform: scale(0.98); }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 24px 0;
    color: #b0bdb5;
    font-size: 13px;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: #d9e8de;
  }

  .register-link {
    text-align: center;
    font-size: 14px;
    color: #7a8c82;
  }
  .register-link a {
    color: var(--green);
    font-weight: 600;
    text-decoration: none;
  }
  .register-link a:hover { text-decoration: underline; }

  .error-msg {
    background: #fdecea;
    color: var(--warn);
    border: 1px solid #f5c6c0;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    margin-bottom: 20px;
    display: none;
  }
  .success-msg {
    background: #e8f5ee;
    color: var(--green);
    border: 1px solid #b8dfc8;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    margin-bottom: 20px;
    display: none;
  }

  @media (max-width: 800px) {
    .left { display: none; }
    .right { width: 100%; }
  }
</style>
</head>
<body>

<div class="left">
  <div class="brand">
    <div class="brand-icon">🌿</div>
    <h1>Food<span>Wise</span></h1>
    <p>Smart food waste management powered by AI. Predict demand, reduce waste, feed communities.</p>
    <div class="stats">
      <div class="stat-item">
        <div class="stat-num">40%</div>
        <div class="stat-label">Waste Reduced</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">5+</div>
        <div class="stat-label">Modules</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">NGO</div>
        <div class="stat-label">Integration</div>
      </div>
    </div>
  </div>
</div>

<div class="right">
  <div class="form-box">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to your FoodWise account</p>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="admin@food.com"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••"/>
    </div>

    <button class="btn" onclick="handleLogin()">Sign In</button>

    <div class="divider">or</div>

    <p class="register-link">No account? <a href="register.html">Create one</a></p>
  </div>
</div>

<script>
  const API = "http://localhost:5000/api";

  async function handleLogin() {
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const errEl    = document.getElementById("errorMsg");
    const sucEl    = document.getElementById("successMsg");

    errEl.style.display = "none";
    sucEl.style.display = "none";

    if (!email || !password) {
      errEl.textContent = "Please enter email and password.";
      errEl.style.display = "block";
      return;
    }

    try {
      const res  = await fetch(`${API}/auth/login`, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (res.ok) {
        localStorage.setItem("user", JSON.stringify(data.user));
        sucEl.textContent = "Login successful! Redirecting...";
        sucEl.style.display = "block";
        setTimeout(() => window.location.href = "dashboard.html", 1000);
      } else {
        errEl.textContent = data.message || "Login failed.";
        errEl.style.display = "block";
      }
    } catch (e) {
      errEl.textContent = "Cannot connect to server. Make sure backend is running.";
      errEl.style.display = "block";
    }
  }

  // Allow Enter key
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") handleLogin();
  });
</script>
</body>
</html>
